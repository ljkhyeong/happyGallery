plugins {
	id 'java-test-fixtures'
}

// 테스트 목적별 실행 태스크
tasks.register('useCaseTest', Test) {
	group = 'verification'
	description = '유스케이스 통합 테스트 (@UseCaseIT)'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'usecase' }
}

tasks.register('policyTest', Test) {
	group = 'verification'
	description = '도메인 정책 단위 테스트 (@Tag("policy"))'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'policy' }
}

// 테스트 로깅
tasks.withType(Test).configureEach {
	useJUnitPlatform()

	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
		showStandardStreams = false
	}
}

dependencies {
	api project(":domain")
	api 'com.fasterxml.jackson.core:jackson-annotations'

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'io.micrometer:micrometer-core'
	implementation 'org.springframework.retry:spring-retry:2.0.12'
	implementation 'org.springframework:spring-aop'
	implementation 'org.springframework:spring-tx'
	implementation 'org.springframework:spring-orm'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.aspectj:aspectjweaver'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// application/domain 타입만 사용하는 공용 테스트 fixture
	testFixturesApi project(":domain")
	testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
	testFixturesApi 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
	testFixturesApi 'org.testcontainers:testcontainers-mysql'
	testFixturesApi 'org.testcontainers:testcontainers'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
	testImplementation 'org.springframework.boot:spring-boot-starter-mail'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.awaitility:awaitility'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
	testImplementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'
	testImplementation 'io.github.resilience4j:resilience4j-timelimiter:2.3.0'
	testImplementation project(":adapter-out-persistence")
	testImplementation project(":adapter-out-external")
	testImplementation project(":adapter-in-web")
	testImplementation testFixtures(project(":test-support"))
	// bootstrap 의 @SpringBootApplication / Flyway / config 클래스가 @SpringBootTest 컨텍스트 부팅에 필요
	testImplementation project(":bootstrap")
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
