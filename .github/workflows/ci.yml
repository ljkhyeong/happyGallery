name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_candidate:
        description: 운영 설정으로 이미지를 검증한다 (게시·배포 없음).
        type: boolean
        default: false
  workflow_call:
    inputs:
      production_release:
        type: boolean
        default: false
      production_candidate:
        type: boolean
        default: false
    outputs:
      security_failed:
        description: 이미지 보안 검사가 취약점으로 실패해 패치 검토가 필요한지 여부
        value: ${{ jobs.container-security.outputs.security_failed }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  compatibility:
    name: Rolling Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - name: Check source compatibility before builds
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_RELEASE: ${{ inputs.production_release }}
        run: ruby deploy/k3s/scripts/ci-compatibility.rb

  agent-feedback:
    name: Agent Feedback Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Validate feedback loop and agent instructions
        run: |
          ruby tools/agent-feedback-test.rb
          ruby tools/check-agent-skills.rb

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  backend-package:
    needs: compatibility
    name: Backend Package & Module Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true

      - name: Build & Test
        # application/web 검사는 별도 실행기에서 수행한다. 나머지 모듈 검사는 유지한다.
        run: ./gradlew --no-daemon build -x :application:check -x :adapter-in-web:check --profile

      - name: Upload application jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-jar
          path: bootstrap/build/libs/happygallery-app.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-package-diagnostics
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            build/reports/profile/
          retention-days: 7

  backend-tests:
    needs: compatibility
    name: Backend Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: application-core
            task: ':application:check -PciTestGroup=core'
          - module: application-commerce
            task: ':application:check -PciTestGroup=commerce'
          - module: application-migration
            task: ':application:check -PciTestGroup=migration'
          - module: adapter-in-web
            task: ':adapter-in-web:check'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true
      - name: Run module checks
        run: ./gradlew --no-daemon ${{ matrix.task }} --profile
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-${{ matrix.module }}-diagnostics
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            build/reports/profile/
          retention-days: 7

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [backend-package, backend-tests]
    if: always()
    steps:
      - name: Require every backend check
        env:
          PACKAGE_RESULT: ${{ needs.backend-package.result }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: test "$PACKAGE_RESULT" = success && test "$TEST_RESULT" = success

  frontend:
    needs: compatibility
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install, audit, lint, verify generated API client & build
        working-directory: frontend
        run: |
          npm ci
          npm run audit:dependencies
          npm run test:unit
          npm run lint
          npm run api:check
          npm run build

      - name: Setup Ruby for deployment validation
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'

      - name: Validate deployment manifests and CSP
        env:
          REQUIRE_FRONTEND_DIST: "1"
        run: ./deploy/k3s/scripts/validate.sh

  e2e-smoke:
    name: Browser Smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-package
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: happygallery
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_USER: happygallery
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download application jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-jar
          path: bootstrap/build/libs

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start local backend
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_URL: jdbc:mysql://127.0.0.1:3306/happygallery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
          DB_USERNAME: happygallery
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          MANAGEMENT_PORT: "8080"
          RATE_LIMIT_ENABLED: "false"
          ALIMTALK_APP_KEY: e2e-alimtalk-app-key
          ALIMTALK_SECRET_KEY: e2e-alimtalk-secret-key
          ALIMTALK_SENDER_KEY: e2e-alimtalk-sender-key
          SMS_API_KEY: e2e-sms-api-key
          SMS_API_SECRET: e2e-sms-api-secret
          SMS_SENDER_NUMBER: "01000000000"
        run: |
          APP_JAR=bootstrap/build/libs/happygallery-app.jar
          test -f "$APP_JAR"
          nohup java -jar "$APP_JAR" >/tmp/happygallery-e2e-app.log 2>&1 &
          for _attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/happygallery-e2e-app.log
          exit 1

      - name: Run smoke browser paths
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:8080/api/v1
          VITE_API_TARGET: http://127.0.0.1:8080
        run: npm run e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/happygallery-e2e-app.log
          retention-days: 7

  container-security:
    name: Container Security
    # 운영 이미지 검사는 production workflow에서 실제 운영 설정으로 수행한다.
    if: ${{ !inputs.production_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-package, frontend]
    outputs:
      security_failed: ${{ steps.scan.outputs.security-failed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download application jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-jar
          path: bootstrap/build/libs

      - name: Build release images
        env:
          IMAGE_PROFILE: ${{ inputs.production_candidate && 'candidate' || 'ci' }}
          VITE_TOSS_CLIENT_KEY: ${{ vars.PRODUCTION_TOSS_CLIENT_KEY }}
          VITE_SENTRY_DSN: ${{ vars.PRODUCTION_SENTRY_DSN }}
        run: bash deploy/k3s/scripts/ci-images.sh build "$IMAGE_PROFILE"

      - name: Scan both images
        id: scan
        uses: ./.github/actions/scan-images
        with:
          image-tag: ${{ inputs.production_candidate && 'candidate' || 'ci' }}
          report-name: container-security-reports

      - name: Require both security scans to pass
        env:
          SECURITY_PASSED: ${{ steps.scan.outputs.passed }}
        run: test "$SECURITY_PASSED" = true

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [compatibility, agent-feedback, dependency-review, backend, frontend, e2e-smoke, container-security]
    steps:
      - name: Require all applicable checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_RELEASE: ${{ inputs.production_release }}
        run: |
          ruby -rjson <<'RUBY'
          expected_skips = []
          expected_skips << 'dependency-review' unless ENV.fetch('EVENT_NAME') == 'pull_request'
          expected_skips << 'container-security' if ENV.fetch('PRODUCTION_RELEASE') == 'true'
          failed = JSON.parse(ENV.fetch('NEEDS_JSON')).reject do |name, job|
            expected = expected_skips.include?(name) ? 'skipped' : 'success'
            job.fetch('result') == expected
          end
          abort "필수 CI 검사 실패: #{failed.transform_values { |job| job.fetch('result') }}" unless failed.empty?
          RUBY
