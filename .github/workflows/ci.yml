name: CI

on:
  pull_request:
    branches: [main, codexReview]
  workflow_call:
    inputs:
      production_release:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  compatibility:
    name: Rolling Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Check source compatibility before builds
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_RELEASE: ${{ inputs.production_release }}
        run: ruby deploy/k3s/scripts/ci-compatibility.rb

  agent-feedback:
    name: Agent Feedback Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Validate feedback loop and agent instructions
        run: |
          ruby tools/agent-feedback-test.rb
          ruby tools/check-agent-skills.rb

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  backend-package:
    needs: compatibility
    name: Backend Package & Module Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build & Test
        # application/web 검사는 별도 실행기에서 수행한다. 나머지 모듈 검사는 유지한다.
        run: ./gradlew --no-daemon build -x :application:check -x :adapter-in-web:check --profile

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: bootstrap/build/libs/happygallery-app.jar
          retention-days: 1

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-package-diagnostics
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            build/reports/profile/
          retention-days: 7

  backend-tests:
    needs: compatibility
    name: Backend Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: application-core
            task: ':application:check -PciTestGroup=core'
          - module: application-commerce
            task: ':application:check -PciTestGroup=commerce'
          - module: application-migration
            task: ':application:check -PciTestGroup=migration'
          - module: adapter-in-web
            task: ':adapter-in-web:check'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Run module checks
        run: ./gradlew --no-daemon ${{ matrix.task }} --profile
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.module }}-diagnostics
          path: |
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            build/reports/profile/
          retention-days: 7

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    needs: [backend-package, backend-tests]
    if: always()
    steps:
      - name: Require every backend check
        env:
          PACKAGE_RESULT: ${{ needs.backend-package.result }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: test "$PACKAGE_RESULT" = success && test "$TEST_RESULT" = success

  frontend:
    needs: compatibility
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install, audit, lint, verify generated API client & build
        working-directory: frontend
        run: |
          npm ci
          npm run audit:dependencies
          npm run test:unit
          npm run lint
          npm run api:check
          npm run build

      - name: Validate deployment manifests and CSP
        env:
          REQUIRE_FRONTEND_DIST: "1"
        run: ./deploy/k3s/scripts/validate.sh

  e2e-smoke:
    name: Browser Smoke E2E
    runs-on: ubuntu-latest
    needs: backend-package
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: happygallery
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_USER: happygallery
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: bootstrap/build/libs

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start local backend
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_URL: jdbc:mysql://127.0.0.1:3306/happygallery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
          DB_USERNAME: happygallery
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          MANAGEMENT_PORT: "8080"
          RATE_LIMIT_ENABLED: "false"
          ALIMTALK_APP_KEY: e2e-alimtalk-app-key
          ALIMTALK_SECRET_KEY: e2e-alimtalk-secret-key
          ALIMTALK_SENDER_KEY: e2e-alimtalk-sender-key
          SMS_API_KEY: e2e-sms-api-key
          SMS_API_SECRET: e2e-sms-api-secret
          SMS_SENDER_NUMBER: "01000000000"
        run: |
          APP_JAR=bootstrap/build/libs/happygallery-app.jar
          test -f "$APP_JAR"
          nohup java -jar "$APP_JAR" >/tmp/happygallery-e2e-app.log 2>&1 &
          for _attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/happygallery-e2e-app.log
          exit 1

      - name: Run smoke browser paths
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:8080/api/v1
          VITE_API_TARGET: http://127.0.0.1:8080
        run: npm run e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/happygallery-e2e-app.log
          retention-days: 7

  container-security:
    name: Container Security
    # 운영 이미지 검사는 production workflow에서 실제 운영 설정으로 수행한다.
    if: ${{ !inputs.production_release }}
    runs-on: ubuntu-latest
    needs: [backend-package, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: bootstrap/build/libs

      - name: Build release images
        run: |
          APP_JAR=bootstrap/build/libs/happygallery-app.jar
          test -f "$APP_JAR"
          chmod 600 "$APP_JAR"
          docker build --build-arg "APP_JAR=$APP_JAR" -f deploy/k3s/images/Dockerfile.app -t happygallery-app:ci .
          ./deploy/k3s/scripts/verify-app-image.sh happygallery-app:ci
          docker build --build-arg "VITE_TOSS_CLIENT_KEY=test_ck_ci" -f deploy/k3s/images/Dockerfile.frontend -t happygallery-frontend:ci .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: happygallery-app:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: happygallery-frontend:ci
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: HIGH,CRITICAL
