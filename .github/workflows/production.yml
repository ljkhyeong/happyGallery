name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 실행 중인 운영 배포를 새 push 때문에 중단하지 않는다.
concurrency:
  group: production-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      production_release: ${{ vars.CD_ENABLED == 'true' }}

  publish:
    name: Publish verified production images
    if: github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.publish.outputs.app_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: bootstrap/build/libs
      - name: Build production images
        env:
          VITE_TOSS_CLIENT_KEY: ${{ vars.PRODUCTION_TOSS_CLIENT_KEY }}
          VITE_SENTRY_DSN: ${{ vars.PRODUCTION_SENTRY_DSN }}
        run: bash deploy/k3s/scripts/ci-images.sh build
      - name: Scan production backend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_EXIT_ON_EOL: "1"
        with:
          image-ref: happygallery-app:production
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan production frontend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        env:
          TRIVY_EXIT_ON_EOL: "1"
        with:
          image-ref: happygallery-frontend:production
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Publish the scanned images
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/k3s/scripts/ci-images.sh publish

  deploy:
    name: Roll out production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy exact image digests over SSH
        env:
          CD_SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          CD_SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
          CD_HOST: ${{ vars.CD_HOST }}
          CD_PORT: ${{ vars.CD_PORT }}
          CD_USER: ${{ vars.CD_USER }}
          APP_REGISTRY_DIGEST: ${{ needs.publish.outputs.app_digest }}
          FRONTEND_REGISTRY_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
        run: bash deploy/k3s/scripts/ci-deploy-ssh.sh
