name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# 실행 중인 운영 배포를 새 push 때문에 중단하지 않는다.
concurrency:
  group: production-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      production_release: ${{ vars.CD_ENABLED == 'true' }}

  publish:
    name: Publish verified production images
    if: github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      security_failed: ${{ steps.scan.outputs.security-failed }}
      app_digest: ${{ steps.publish.outputs.app_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-jar
          path: bootstrap/build/libs
      - name: Build production images
        env:
          VITE_TOSS_CLIENT_KEY: ${{ vars.PRODUCTION_TOSS_CLIENT_KEY }}
          VITE_SENTRY_DSN: ${{ vars.PRODUCTION_SENTRY_DSN }}
        run: bash deploy/k3s/scripts/ci-images.sh build
      - name: Scan production images
        id: scan
        uses: ./.github/actions/scan-images
        with:
          image-tag: production
          report-name: production-security-reports
      - name: Require both security scans to pass
        env:
          SECURITY_PASSED: ${{ steps.scan.outputs.passed }}
        run: test "$SECURITY_PASSED" = true
      - name: Publish the scanned images
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/k3s/scripts/ci-images.sh publish

  deploy:
    name: Roll out production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy exact image digests over SSH
        env:
          CD_SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          CD_SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
          CD_HOST: ${{ vars.CD_HOST }}
          CD_PORT: ${{ vars.CD_PORT }}
          CD_USER: ${{ vars.CD_USER }}
          APP_REGISTRY_DIGEST: ${{ needs.publish.outputs.app_digest }}
          FRONTEND_REGISTRY_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
        run: bash deploy/k3s/scripts/ci-deploy-ssh.sh

  security-update:
    name: Prepare security update PR
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.security_failed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-security-reports
          path: /tmp/security-reports
      - name: Propose supported patch updates
        id: update
        run: ruby deploy/k3s/scripts/security-update.rb /tmp/security-reports/*.json
      - name: Create PR and start validation
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/k3s/scripts/open-security-update-pr.sh
