name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# 실행 중인 운영 배포를 새 push 때문에 중단하지 않는다.
concurrency:
  group: production-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      production_release: ${{ vars.CD_ENABLED == 'true' }}

  publish:
    name: Publish verified production images
    if: github.ref == 'refs/heads/main' && vars.CD_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      security_failed: ${{ steps.scan.outputs.security-failed }}
      app_digest: ${{ steps.publish.outputs.app_digest }}
      frontend_digest: ${{ steps.publish.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-jar
          path: bootstrap/build/libs
      - name: Build production images
        env:
          VITE_TOSS_CLIENT_KEY: ${{ vars.PRODUCTION_TOSS_CLIENT_KEY }}
          VITE_SENTRY_DSN: ${{ vars.PRODUCTION_SENTRY_DSN }}
        run: bash deploy/k3s/scripts/ci-images.sh build
      - name: Scan production images
        id: scan
        uses: ./.github/actions/scan-images
        with:
          image-tag: production
          report-name: production-security-reports
      - name: Require both security scans to pass
        env:
          SECURITY_PASSED: ${{ steps.scan.outputs.passed }}
        run: test "$SECURITY_PASSED" = true
      - name: Publish the scanned images
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/k3s/scripts/ci-images.sh publish

  promote:
    name: Publish GitOps desired state
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1
        with:
          ruby-version: '3.3'
      - name: Render exact image digests for Argo CD
        env:
          ACME_EMAIL: ${{ vars.PRODUCTION_ACME_EMAIL }}
          APP_REGISTRY_DIGEST: ${{ needs.publish.outputs.app_digest }}
          FRONTEND_REGISTRY_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
        run: ruby deploy/k3s/scripts/gitops-release.rb /tmp/gitops-production
      - name: Promote verified release in Git
        run: ruby deploy/k3s/scripts/publish-gitops.rb /tmp/gitops-production

  security-update:
    name: Prepare security update PR
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.security_failed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1
        with:
          ruby-version: '3.3'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-security-reports
          path: /tmp/security-reports
      - name: Propose supported patch updates
        id: update
        run: ruby deploy/k3s/scripts/security-update.rb /tmp/security-reports/*.json
      - name: Create PR and start validation
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/k3s/scripts/open-security-update-pr.sh
