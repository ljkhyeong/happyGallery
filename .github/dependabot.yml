version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Seoul
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Seoul
    groups:
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Seoul
    ignore:
      # v6부터 캐시 구현이 Gradle 이용약관의 비공개 구성요소로 바뀌어 MIT 라이선스인 v5 계열을 유지한다(deploy/k3s/cicd.md).
      - dependency-name: "gradle/actions*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /deploy/k3s/images
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Seoul
    ignore:
      # 홀수 Node major는 LTS가 되지 않고 반년 뒤 지원이 끝나므로 배포 이미지는 짝수 LTS만 받는다.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
    groups:
      container-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Seoul
    groups:
      local-container-minor-and-patch:
        update-types:
          - minor
          - patch
