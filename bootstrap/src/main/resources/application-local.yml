spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/happygallery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:happygallery}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  admin:
    api-key: dev-admin-key
    enable-api-key-auth: true
  session:
    secure-cookie: false
  field-encryption:
    active-key-id: v1
    encrypt-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    hmac-key: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
  guest-token:
    hmac-secret: "local-guest-token-hmac-secret-at-least-32-bytes"

management:
  server:
    port: ${MANAGEMENT_PORT:8080}
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: DEBUG
    com.personal.happygallery: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: WARN
