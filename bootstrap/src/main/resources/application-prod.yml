server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI}
          naver:
            client-id: ${NAVER_OAUTH_CLIENT_ID}
            client-secret: ${NAVER_OAUTH_CLIENT_SECRET}
            redirect-uri: ${NAVER_OAUTH_REDIRECT_URI}
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  external:
    notification:
      mode: ${NOTIFICATION_MODE:nhn}
  admin:
    enable-api-key-auth: false
    require-mfa-enrollment: true
  payment:
    require-complete-business-profile: true

logging:
  level:
    root: INFO
    com.personal.happygallery: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  structured:
    json:
      # logback-spring.xml의 운영 JSON(logstash 형식)에 서비스 이름을 붙이고 기존에 없던 필드는 뺀다.
      add:
        service: ${spring.application.name:happygallery}
      exclude: "@version,level_value,tags"
      customizer: com.personal.happygallery.bootstrap.logging.SensitiveLogJsonMembersCustomizer

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
