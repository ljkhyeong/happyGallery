spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  social-login:
    google-redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:3000/auth/callback/google}
    naver-redirect-uri: ${NAVER_OAUTH_REDIRECT_URI:http://localhost:3000/auth/callback/naver}

logging:
  level:
    root: INFO
    com.personal.happygallery: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
