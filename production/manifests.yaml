apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: happygallery
  name: prometheus
  namespace: happygallery
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  ports:
  - name: http
    port: 9090
    targetPort: http
