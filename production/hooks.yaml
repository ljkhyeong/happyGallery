---
apiVersion: batch/v1
kind: Job
metadata:
  name: happygallery-gitops-prepare
  namespace: happygallery
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: control
        image: ghcr.io/ljkhyeong/happygallery-frontend@sha256:944d182d71474ad0714444bcdd7d92af3fdfc42ac94be91197d26b23395baf5a
        imagePullPolicy: IfNotPresent
        command:
        - node
        - "-e"
        - |
          const net = require('node:net');
          const request = JSON.parse(process.env.GITOPS_REQUEST);
          const client = net.createConnection('/control/control.sock');
          let response = '';
          client.setTimeout(3200000, () => client.destroy(new Error('호스트 응답 시간이 초과됐습니다.')));
          client.on('connect', () => client.write(JSON.stringify(request) + '\n'));
          client.on('data', chunk => { response += chunk; });
          client.on('end', () => {
            try {
              const result = JSON.parse(response);
              console.log(result.message);
              process.exitCode = result.ok ? 0 : 1;
            } catch (error) { console.error(error.message); process.exitCode = 1; }
          });
          client.on('error', error => { console.error(error.message); process.exitCode = 1; });
        env:
        - name: GITOPS_REQUEST
          value: '{"source_sha":"c9d5049b2eda8cc86d618c18790e019a9a5033f0","app_digest":"sha256:78b83c5c7f5adcc856e1e01fc8d522ab4be4628a1685d89ccee24fec1bc2f572","frontend_digest":"sha256:944d182d71474ad0714444bcdd7d92af3fdfc42ac94be91197d26b23395baf5a","acme_email":"jolri24@gmail.com","manifest_sha256":"4c613cbef830d3c44fbff1579f913719dbd0d43b93a176349d57e7dd2dc0fbee","phase":"prepare"}'
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: control
          mountPath: "/control"
          readOnly: true
      volumes:
      - name: control
        hostPath:
          path: "/run/happygallery-gitops"
          type: Directory
