---
apiVersion: batch/v1
kind: Job
metadata:
  name: happygallery-gitops-prepare
  namespace: happygallery
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: control
        image: ghcr.io/ljkhyeong/happygallery-frontend@sha256:16699c7c5129f5c0f66ff4b316be1ea1fc7eedd5d90a5586f0e6e86157343ddb
        imagePullPolicy: IfNotPresent
        command:
        - node
        - "-e"
        - |
          const net = require('node:net');
          const request = JSON.parse(process.env.GITOPS_REQUEST);
          const client = net.createConnection('/control/control.sock');
          let response = '';
          client.setTimeout(3200000, () => client.destroy(new Error('호스트 응답 시간이 초과됐습니다.')));
          client.on('connect', () => client.write(JSON.stringify(request) + '\n'));
          client.on('data', chunk => { response += chunk; });
          client.on('end', () => {
            try {
              const result = JSON.parse(response);
              console.log(result.message);
              process.exitCode = result.ok ? 0 : 1;
            } catch (error) { console.error(error.message); process.exitCode = 1; }
          });
          client.on('error', error => { console.error(error.message); process.exitCode = 1; });
        env:
        - name: GITOPS_REQUEST
          value: '{"source_sha":"14209421d726cbc6a81daab5c12096197803ca7b","app_digest":"sha256:c5835946d1578dcb60f66bc2b7ae8844f50a4720f7cb399d99b80e1921ba4e60","frontend_digest":"sha256:16699c7c5129f5c0f66ff4b316be1ea1fc7eedd5d90a5586f0e6e86157343ddb","acme_email":"jolri24@gmail.com","manifest_sha256":"58e655c4e43ed5f19050cc49e59292294447f775794207648b4e09a7b29b8ce3","phase":"prepare"}'
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: control
          mountPath: "/control"
          readOnly: true
      volumes:
      - name: control
        hostPath:
          path: "/run/happygallery-gitops"
          type: Directory
