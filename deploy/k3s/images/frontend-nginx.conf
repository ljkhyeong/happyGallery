worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 15s;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'report-sample' 'sha256-7xnmY8tGXPOmq7UbjJR05Gr6xjs3EVjN0KkG9kWFq68=' https://js.tosspayments.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://tosspayments.com https://*.tosspayments.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src https://tosspayments.com https://*.tosspayments.com; manifest-src 'self'; media-src 'self'; worker-src 'self' blob:" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API가 Ingress에서 잘못 라우팅돼도 SPA 문서로 숨기지 않는다.
        location = /api {
            default_type application/json;
            return 404 '{"code":"NOT_FOUND","message":"API route is not served by frontend"}';
        }

        location ^~ /api/ {
            default_type application/json;
            return 404 '{"code":"NOT_FOUND","message":"API route is not served by frontend"}';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
