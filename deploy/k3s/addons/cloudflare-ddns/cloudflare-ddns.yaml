apiVersion: v1
kind: Namespace
metadata:
  name: happygallery-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ddns
          image: favonia/cloudflare-ddns:1.17.0@sha256:61013368c8f95981c0bb8bf56d962078d8b4e95724a554fa2dabb20d6e478097
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: CLOUDFLARE_API_TOKEN_FILE
              value: /run/secrets/cloudflare/token
            - name: IP4_DOMAINS
              value: happy-gallery.com
            - name: IP6_PROVIDER
              value: none
            - name: PROXIED
              value: "false"
            - name: DELETE_ON_STOP
              value: "false"
            - name: UPDATE_CRON
              value: "@every 5m"
            - name: TZ
              value: Asia/Seoul
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: cloudflare-token
              mountPath: /run/secrets/cloudflare
              readOnly: true
      volumes:
        - name: cloudflare-token
          secret:
            secretName: cloudflare-ddns
            defaultMode: 0440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflare-ddns
spec:
  podSelector:
    matchLabels:
      app: cloudflare-ddns
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
