groups:
  - name: happygallery-system
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{application="happygallery",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{application="happygallery"}[5m])), 0.001)
          ) > 0.1
          and
          sum(increase(http_server_requests_seconds_count{application="happygallery"}[5m])) >= 20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "최근 5분 HTTP 요청 20건 이상에서 5xx 비율이 10%를 초과했습니다"

      - alert: LowTrafficHttpErrors
        expr: |
          sum(increase(http_server_requests_seconds_count{application="happygallery",status=~"5.."}[15m])) >= 3
          and
          sum(increase(http_server_requests_seconds_count{application="happygallery"}[5m])) < 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "저트래픽 구간에서 최근 15분 5xx가 3건 이상 발생했습니다"

      - alert: HighResponseLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{application="happygallery"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP p95 응답 시간이 2초를 초과합니다 ({{ $value | printf \"%.2f\" }}s)"

      - alert: HikariPoolExhaustion
        expr: hikaricp_connections_active{application="happygallery"} / hikaricp_connections_max{application="happygallery"} > 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP 커넥션 풀 사용률이 80%를 초과합니다"

      - alert: JvmHeapHigh
        expr: jvm_memory_used_bytes{application="happygallery",area="heap"} / jvm_memory_max_bytes{application="happygallery",area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 힙 사용률이 85%를 초과합니다"

      - alert: PaymentExecutorQueueHigh
        expr: |
          executor_queued_tasks{application="happygallery",name="paymentTimeoutExecutor"}
          /
          clamp_min(
            executor_queued_tasks{application="happygallery",name="paymentTimeoutExecutor"}
            + executor_queue_remaining_tasks{application="happygallery",name="paymentTimeoutExecutor"},
            1
          ) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PG 호출 대기열 사용률이 80%를 초과합니다"

      - alert: PaymentExecutorRejected
        expr: increase(happygallery_payment_executor_rejected_total{application="happygallery"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "최근 5분 동안 PG 호출 대기열 거절이 발생했습니다 ({{ $value | printf \"%.0f\" }}건)"

      - alert: DurableSignalExecutorRejected
        expr: |
          sum by (executor) (
            increase(happygallery_async_executor_rejected_total{application="happygallery"}[5m])
          ) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.executor }} 커밋 후 실행 신호가 거절되어 DB 복구 경로로 이관됐습니다 ({{ $value | printf \"%.0f\" }}건)"

      - alert: DurableSignalExecutorQueueHigh
        expr: |
          max by (name) (
            executor_queued_tasks{application="happygallery",name=~"notificationExecutor|refundExecutor"}
            /
            clamp_min(
              executor_queued_tasks{application="happygallery",name=~"notificationExecutor|refundExecutor"}
              + executor_queue_remaining_tasks{application="happygallery",name=~"notificationExecutor|refundExecutor"},
              1
            )
          ) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} 커밋 후 실행 신호 대기열 사용률이 80%를 초과했습니다"

      - alert: PaymentCircuitBreakerOpen
        expr: |
          max by (name) (resilience4j_circuitbreaker_state{application="happygallery",name="paymentProvider",state="open"}) == 1
          or
          sum by (name) (increase(resilience4j_circuitbreaker_not_permitted_calls_total{application="happygallery",name="paymentProvider"}[2m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "PG 서킷 브레이커가 열렸거나 최근 호출을 차단했습니다"

      - alert: PaymentConfirmReconciliationRequired
        expr: increase(happygallery_payment_confirm_reconciliation_required_total{application="happygallery"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PG 멱등 안전 기간을 지나 수동 대사가 필요한 결제가 발생했습니다 ({{ $value | printf \"%.0f\" }}건)"

      - alert: PaymentReconciliationRequiredBacklog
        expr: max(happygallery_payment_confirm_reconciliation_backlog_count{application="happygallery"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "운영자 대사가 필요한 결제가 DB backlog에 남아 있습니다"

      - alert: RefundActionRequiredBacklog
        expr: max(happygallery_refund_backlog_count{application="happygallery",status=~"failed|reconciliation_required"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "운영자 확인이 필요한 환불이 DB backlog에 남아 있습니다"

      - alert: RefundRecoveryBacklogStalled
        expr: max(happygallery_refund_backlog_oldest_age_seconds{application="happygallery",status=~"requested|processing|retryable"}) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "자동 복구 대상 환불이 상태별 처리 기준 시각을 5분 넘겼습니다"

      - alert: NotificationTimeoutExecutorQueueHigh
        expr: |
          max by (name) (
            executor_queued_tasks{application="happygallery",name=~"alimtalkNotificationTimeoutExecutor|smsNotificationTimeoutExecutor|phoneVerificationTimeoutExecutor|emailVerificationTimeoutExecutor"}
            /
            clamp_min(
              executor_queued_tasks{application="happygallery",name=~"alimtalkNotificationTimeoutExecutor|smsNotificationTimeoutExecutor|phoneVerificationTimeoutExecutor|emailVerificationTimeoutExecutor"}
              + executor_queue_remaining_tasks{application="happygallery",name=~"alimtalkNotificationTimeoutExecutor|smsNotificationTimeoutExecutor|phoneVerificationTimeoutExecutor|emailVerificationTimeoutExecutor"},
              1
            )
          ) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} 대기열 사용률이 80%를 초과합니다"

      - alert: NotificationTimeoutExecutorRejected
        expr: |
          sum by (__name__) (
            increase({application="happygallery",__name__=~"happygallery_notification_(alimtalk|sms|phone_verification|email_verification)_executor_rejected_total"}[5m])
          ) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.__name__ }} 대기열 거절이 발생했습니다 ({{ $value | printf \"%.0f\" }}건)"

      - alert: NotificationCircuitBreakerOpen
        expr: |
          max by (name) (resilience4j_circuitbreaker_state{application="happygallery",name=~"alimtalkNotification|smsNotification|phoneVerificationSms|emailVerification",state="open"}) == 1
          or
          sum by (name) (increase(resilience4j_circuitbreaker_not_permitted_calls_total{application="happygallery",name=~"alimtalkNotification|smsNotification|phoneVerificationSms|emailVerification"}[2m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} 서킷 브레이커가 열렸거나 최근 호출을 차단했습니다"

      - alert: NotificationOutboxFailed
        expr: increase(happygallery_notification_outbox_failed_total{application="happygallery"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "자동 재시도를 모두 소진한 알림이 발생했습니다 ({{ $value | printf \"%.0f\" }}건)"

      - alert: NotificationOutboxFailedBacklog
        expr: max(happygallery_notification_outbox_backlog_count{application="happygallery",status="failed"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "운영자 재처리를 기다리는 실패 알림이 남아 있습니다"

      - alert: NotificationOutboxProcessingStalled
        expr: max(happygallery_notification_outbox_backlog_oldest_age_seconds{application="happygallery",status="processing"}) > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "알림 outbox 선점이 2분 넘게 완료되지 않았습니다"

      - alert: NotificationOutboxPendingStalled
        expr: max(happygallery_notification_outbox_backlog_oldest_age_seconds{application="happygallery",status="pending"}) > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "알림 outbox가 재시도 예정 시각을 1분 넘겼습니다"

      - alert: NotificationLogPersistenceFailed
        expr: increase(happygallery_notification_log_persistence_failed_total{application="happygallery"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "외부 알림 결과의 감사 이력 저장이 실패했습니다 ({{ $value | printf \"%.0f\" }}건)"

      - alert: AdminSessionValidationFailed
        expr: increase(happygallery_admin_session_validation_failures_total{application="happygallery"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "저장된 관리자 세션 복호화 또는 역직렬화가 실패했습니다"

      - alert: CustomerSessionRevocationFailed
        expr: increase(happygallery_customer_session_revocation_failed_total{application="happygallery"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "회원 자격 증명 변경 후 이전 Redis 세션 폐기가 실패했습니다 ({{ $value | printf \"%.0f\" }}건)"

      - alert: OrderApprovalPending
        expr: max(happygallery_order_approval_backlog_count{application="happygallery"}) > 0
        for: 1m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "승인 대기 주문이 DB에 남아 있습니다. 관리자 오늘 할 일에서 확인하세요"

      - alert: BookingCancellationTaskPending
        expr: max(happygallery_booking_cancellation_task_backlog_count{application="happygallery"}) > 0
        for: 1m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "운영자가 마무리해야 하는 예약 취소 후속 작업이 DB에 남아 있습니다"

      - alert: OrderApprovalDeadlineApproaching
        expr: max(happygallery_order_approval_backlog_oldest_age_seconds{application="happygallery"}) > 64800
        for: 5m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "승인 마감까지 6시간 이하로 남은 결제 주문이 있습니다"

      - alert: BatchExecutionFailed
        expr: increase(happygallery_batch_runs_total{application="happygallery",status=~"partial|failed"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "최근 10분 동안 배치 실패 또는 부분 실패가 발생했습니다 ({{ $value | printf \"%.0f\" }}회)"

      - alert: BatchRecoveryStalled
        expr: time() - min(happygallery_batch_last_success_seconds{application="happygallery",job=~"refund_recovery|payment_confirm_recovery|payment_attempt_expiry"}) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "결제·환불 복구 배치가 5분 넘게 정상 완료되지 않았습니다"

      - alert: HourlyBusinessBatchStalled
        expr: (time() - min(happygallery_batch_last_success_seconds{application="happygallery",job=~"order_auto_refund|pickup_expire|pickup_deadline_reminder|pass_expiry_notification|booking_d1_reminder|booking_same_day_reminder"}) > 7200) and (time() - min(process_start_time_seconds{application="happygallery"}) > 7200)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "시간 단위 주문·픽업 배치가 2시간 넘게 정상 완료되지 않았습니다"

      - alert: DailyBusinessBatchStalled
        expr: (time() - min(happygallery_batch_last_success_seconds{application="happygallery",job=~"pass_expiry|personal_data_retention"}) > 108000) and (time() - min(process_start_time_seconds{application="happygallery"}) > 108000)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "일 단위 만료·리마인드·보존 배치가 30시간 넘게 정상 완료되지 않았습니다"

      - alert: MediaStorageCapacityHigh
        expr: max(happygallery_media_storage_bytes{application="happygallery"}) > 4294967296
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "이미지 저장소 사용량이 5Gi PVC의 80%를 넘었습니다"

      - alert: MediaStorageRefreshFailed
        expr: increase(happygallery_media_storage_refresh_failed_total{application="happygallery"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "최근 10분 동안 이미지 저장소 사용량 갱신이 실패했습니다"

      - alert: MediaStorageRefreshStalled
        expr: (time() - max(happygallery_media_storage_last_success_seconds{application="happygallery"}) > 900) and (time() - min(process_start_time_seconds{application="happygallery"}) > 900)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "이미지 저장소 사용량이 15분 넘게 갱신되지 않았습니다"

      - alert: OperationalBacklogRefreshFailed
        expr: increase(happygallery_operational_backlog_refresh_failures_total{application="happygallery"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "최근 5분 동안 운영 backlog DB 스냅샷 갱신이 실패했습니다"

      - alert: OperationalBacklogRefreshStalled
        expr: max by (source) (happygallery_operational_backlog_refresh_age_seconds{application="happygallery"}) > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.source }} backlog 스냅샷이 1분 넘게 갱신되지 않았습니다"

      - alert: AppDown
        expr: up{job="happygallery"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "happyGallery 앱 또는 필수 DB·Redis 의존성이 준비되지 않았습니다"
