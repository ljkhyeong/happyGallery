apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: happygallery-tls
  labels:
    app.kubernetes.io/part-of: happygallery
spec:
  secretName: happygallery-tls
  dnsNames:
    - __PUBLIC_HOST__
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    customResponseHeaders:
      Permissions-Policy: camera=(), microphone=(), geolocation=()
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: happygallery-http
  labels:
    app.kubernetes.io/part-of: happygallery
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: happygallery-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: __PUBLIC_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: happygallery-https
  labels:
    app.kubernetes.io/part-of: happygallery
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: happygallery-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - __PUBLIC_HOST__
      secretName: happygallery-tls
  rules:
    - host: __PUBLIC_HOST__
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
