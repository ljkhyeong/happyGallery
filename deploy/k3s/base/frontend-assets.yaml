apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontend-assets
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-assets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend-assets
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-assets
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-assets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-assets
        app.kubernetes.io/part-of: happygallery
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: publish-assets
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Never
          command: [node, /app/publish-assets.mjs, /app/build/client/assets, /assets]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: assets, mountPath: /assets}
      containers:
        - name: frontend-assets
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Never
          command: [node, /app/assets-server.mjs]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: [sh, -ec, sleep 10]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: assets, mountPath: /assets, readOnly: true}
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: frontend-assets
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-assets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend-assets
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: happygallery-assets
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: happygallery-security-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [__PUBLIC_HOST__]
      secretName: happygallery-tls
  rules:
    - host: __PUBLIC_HOST__
      http:
        paths:
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: frontend-assets
                port:
                  name: http
