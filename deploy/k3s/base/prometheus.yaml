apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: happygallery
data:
  prometheus.yml: |-
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/alerts.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093
    scrape_configs:
      - job_name: happygallery
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - app-management:8081
  alerts.yml: |-
    groups:
      - name: happygallery-system
        rules:
          - alert: AppDown
            expr: up{job="happygallery"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: happyGallery 앱 또는 필수 DB·Redis 의존성이 준비되지 않았습니다
          - alert: HighErrorRate
            expr: rate(http_server_requests_seconds_count{application="happygallery",status=~"5.."}[5m]) > 0.5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 5xx 응답률이 높습니다
          - alert: HighResponseLatency
            expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{application="happygallery"}[5m])) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: HTTP p95 응답 시간이 2초를 초과했습니다
          - alert: HikariPoolExhaustion
            expr: hikaricp_connections_active{application="happygallery"} / hikaricp_connections_max{application="happygallery"} > 0.8
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: HikariCP 사용률이 80%를 초과했습니다
          - alert: JvmHeapHigh
            expr: jvm_memory_used_bytes{application="happygallery",area="heap"} / jvm_memory_max_bytes{application="happygallery",area="heap"} > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: JVM heap 사용률이 85%를 초과했습니다
          - alert: PaymentExecutorRejected
            expr: increase(happygallery_payment_executor_rejected_total{application="happygallery"}[5m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: PG 호출 대기열 거절이 발생했습니다
          - alert: PaymentExecutorQueueHigh
            expr: executor_queued_tasks{application="happygallery",name="paymentTimeoutExecutor"} / clamp_min(executor_queued_tasks{application="happygallery",name="paymentTimeoutExecutor"} + executor_queue_remaining_tasks{application="happygallery",name="paymentTimeoutExecutor"}, 1) > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: PG 호출 대기열 사용률이 80%를 초과했습니다
          - alert: PaymentConfirmReconciliationRequired
            expr: increase(happygallery_payment_confirm_reconciliation_required_total{application="happygallery"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: PG 멱등 안전 기간을 지나 수동 대사가 필요한 결제가 발생했습니다
          - alert: RefundActionRequiredBacklog
            expr: max(happygallery_refund_backlog_count{application="happygallery",status=~"failed|reconciliation_required"}) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 운영자 확인이 필요한 환불이 DB backlog에 남아 있습니다
          - alert: RefundRecoveryBacklogStalled
            expr: max(happygallery_refund_backlog_oldest_age_seconds{application="happygallery",status=~"requested|processing|retryable"}) > 300
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 자동 복구 대상 환불이 상태별 처리 기준 시각을 5분 넘겼습니다
          - alert: NotificationTimeoutExecutorRejected
            expr: increase(happygallery_notification_executor_rejected_total{application="happygallery"}[5m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 알림 외부 호출 대기열 거절이 발생했습니다
          - alert: NotificationTimeoutExecutorQueueHigh
            expr: executor_queued_tasks{application="happygallery",name="notificationTimeoutExecutor"} / clamp_min(executor_queued_tasks{application="happygallery",name="notificationTimeoutExecutor"} + executor_queue_remaining_tasks{application="happygallery",name="notificationTimeoutExecutor"}, 1) > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: 알림 외부 호출 대기열 사용률이 80%를 초과했습니다
          - alert: NotificationOutboxFailed
            expr: increase(happygallery_notification_outbox_failed_total{application="happygallery"}[5m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 자동 재시도를 모두 소진한 알림이 발생했습니다
          - alert: NotificationOutboxFailedBacklog
            expr: max(happygallery_notification_outbox_backlog_count{application="happygallery",status="failed"}) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 운영자 재처리를 기다리는 실패 알림이 남아 있습니다
          - alert: NotificationOutboxProcessingStalled
            expr: max(happygallery_notification_outbox_backlog_oldest_age_seconds{application="happygallery",status="processing"}) > 120
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 알림 outbox 선점이 2분 넘게 완료되지 않았습니다
          - alert: NotificationOutboxPendingStalled
            expr: max(happygallery_notification_outbox_backlog_oldest_age_seconds{application="happygallery",status="pending"}) > 60
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 알림 outbox가 재시도 예정 시각을 1분 넘겼습니다
          - alert: NotificationLogPersistenceFailed
            expr: increase(happygallery_notification_log_persistence_failed_total{application="happygallery"}[5m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 외부 알림 결과의 감사 이력 저장이 실패했습니다
          - alert: BatchExecutionFailed
            expr: increase(happygallery_batch_runs_total{application="happygallery",status=~"partial|failed"}[10m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 최근 10분 동안 배치 실패 또는 부분 실패가 발생했습니다
          - alert: BatchRecoveryStalled
            expr: time() - min(happygallery_batch_last_success_seconds{application="happygallery",job=~"refund_recovery|payment_confirm_recovery|payment_attempt_expiry"}) > 300
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 결제·환불 복구 배치가 5분 넘게 정상 완료되지 않았습니다
          - alert: OperationalBacklogRefreshFailed
            expr: increase(happygallery_operational_backlog_refresh_failures_total{application="happygallery"}[5m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 최근 5분 동안 운영 backlog DB 스냅샷 갱신이 실패했습니다
          - alert: OperationalBacklogRefreshStalled
            expr: max(happygallery_operational_backlog_refresh_age_seconds{application="happygallery"}) > 60
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 환불·알림 backlog 스냅샷이 1분 넘게 갱신되지 않았습니다
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: happygallery
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: happygallery
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: happygallery
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.12.0-distroless
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: config
              mountPath: /etc/prometheus/rules/alerts.yml
              subPath: alerts.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 2Gi
